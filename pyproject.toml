[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablekl"
version = "1.0.1"
description = "Numerically repaired KL divergences for PyTorch: torch.distributions.kl_divergence, torch.nn.functional.kl_div and a logits path"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = ["torch>=2.1", "numpy>=1.24", "mpmath>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["stablekl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation (million-sample round trips, high-precision quadrature)"]
